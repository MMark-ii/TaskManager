<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platforms</title>
</head>
<body>
    <h1>Platforms</h1>
    <a href="{{ url_for('platforms.add_platform') }}">Add Platform</a>
    <ul>
        {% for platform in platforms %}
            <li>
                <form action="{{ url_for('platforms.edit_platform', platform_name=platform.name) }}" method="GET" style="display:inline;">
                    <button type="submit">{{ platform.name }}</button>
                </form>
                <form action="{{ url_for('platforms.delete_platform', platform_name=platform.name) }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this platform?');">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('tasks.task_list') }}">Back</a>
</body>
</html>
