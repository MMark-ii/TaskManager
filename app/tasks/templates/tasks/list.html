<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Список задач</h1>
    <a href="{{ url_for('tasks.add_task') }}">Add Task</a>
    <ul>
        {% for task in tasks %}
            <li>
                <form action="{{ url_for('tasks.edit_task', task_id=task.id) }}" method="GET" style="display:inline;">
                    <button type="submit">{{ task.title }}</button>
                </form>
                <form action="{{ url_for('tasks.task_log', task_id=task.id) }}" method="GET" style="display:inline;">
                    <button type="submit">Log</button>
                </form>
                <form action="{{ url_for('tasks.delete_task', task_id=task.id) }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this task?');">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
