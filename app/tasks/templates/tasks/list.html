<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
</head>
<body>
    <h1>Tasks</h1>
    <a href="{{ url_for('tasks.add_task') }}">Add Task</a>
    <ul>
        {% for task in tasks %}
            <li>
                <form action="{{ url_for('tasks.edit_task', task_id=task.id) }}" method="GET">
                    <button type="submit">{{ task.title }}</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
