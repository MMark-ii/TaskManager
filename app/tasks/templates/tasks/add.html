<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Новая задача</h1>
    <form method="POST">
        <p>
            <label for="title">Title:</label><br>
            <input type="text" name="title" id="title" required>
        </p>
        <p>
            <label for="theme_prompt">Theme Prompt (Google Docs URL):</label><br>
            <input type="url" name="theme_prompt" id="theme_prompt" required>
        </p>
        <p>
            <label for="article_prompt">Article Prompt (Google Docs URL):</label><br>
            <input type="url" name="article_prompt" id="article_prompt" required>
        </p>
        <p>
            <label for="image_prompt">Image Prompt (Google Docs URL):</label><br>
            <input type="url" name="image_prompt" id="image_prompt" required>
        </p>
        <p>
            <label for="theme_list">Theme List (Google Sheets URL):</label><br>
            <input type="url" name="theme_list" id="theme_list" required>
        </p>
        <p>
            <label for="article_list">Article List (Google Sheets URL):</label><br>
            <input type="url" name="article_list" id="article_list" required>
        </p>
        <p>
            <label for="platforms">Platforms:</label><br>
            <select name="platforms" id="platforms" multiple required>
                <option value="Platform 1">Platform 1</option>
                <option value="Platform 2">Platform 2</option>
                <option value="Platform 3">Platform 3</option>
            </select>
            <a href="{{ url_for('platforms.platform_list') }}">Edit Platforms</a>
        </p>
        <p>
            <label for="schedule_time">Schedule Time (HH:MM):</label><br>
            <input type="time" name="schedule_time" id="schedule_time" required>
        </p>
        <p>
            <label for="schedule_days">Schedule Days:</label><br>
            <input type="number" name="schedule_days" id="schedule_days" step="0.1" required>
        </p>
        <p>
            <label>Status:</label><br>
            <input type="radio" name="is_active" value="active" checked> Active<br>
            <input type="radio" name="is_active" value="inactive"> Inactive
        </p>
        <p><button type="submit">Save</button></p>
    </form>
    <a href="{{ url_for('tasks.task_list') }}">Back</a>
</body>
</html>
